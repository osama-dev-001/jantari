<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jantari | Welcome</title>
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .city-card {
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            border-radius: 20px;
        }
        .city-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1) !important;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="display-4 fw-bold mb-2">Digital Jantari</h1>
        <p class="text-secondary mb-5">Select your city to view accurate prayer and Ramadan timings</p>

        <div class="row g-4 justify-content-center">
            <div class="col-md-4">
                <a href="jantari.html?city=amd" class="text-decoration-none">
                    <div class="card city-card shadow-sm p-5">
                        <div class="display-1 mb-3">🏙️</div>
                        <h3 class="text-primary fw-bold">Ahmedabad</h3>
                        <p class="text-muted small">Western India Timings</p>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="jantari.html?city=vns" class="text-decoration-none">
                    <div class="card city-card shadow-sm p-5">
                        <div class="display-1 mb-3">🕌</div>
                        <h3 class="text-success fw-bold">Varanasi</h3>
                        <p class="text-muted small">UP East Timings</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
