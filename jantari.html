<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Jantari Portal</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
	<script src="assets/js/navbar.js"></script>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
	<section class="clock-section">
		<div class="container">
			<div class="header-flex">
				<div class="mobile-meta-row">
					<div class="date-side">
						<p id="display-date">26 February, 2026</p>
					</div>

					<div class="city-pill">
						<span class="city-label">CITY:</span>
						<select id="location-switcher">
							<option value="amd">Ahmedabad</option>
							<option value="vns">Varanasi</option>
						</select>
					</div>
				</div>

				<div class="glass-time-box">
					<h1 id="live-clock">12:08:27 PM</h1>
					<div class="next-salah-countdown">
						<span id="next-salah-name">NEXT: DHUHR</span>
						<span id="countdown-timer" class="fw-bold">0H 02M 32S</span>
					</div>
				</div>
			</div>
		</div>
	</section>

	<div class="container mt-4">
		<ul class="nav nav-pills nav-fill mb-4 shadow-sm rounded bg-white p-1" id="mainTab">
			<li class="nav-item">
				<button class="nav-link active fw-bold" data-bs-toggle="tab" data-bs-target="#live-view">🕒 Live Schedule</button>
			</li>
			<li class="nav-item">
				<button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#yearly-view">📅 Yearly Jantari</button>
			</li>
		</ul>

		<div class="tab-content">
			<div class="tab-pane fade show active" id="live-view">
				<div class="card status-card shadow-sm overflow-hidden">
					<div class="list-group list-group-flush" id="daily-schedule">
					</div>
				</div>
			</div>

			<div class="tab-pane fade" id="yearly-view">
				<div class="btn-group w-100 mb-4 shadow-sm" id="quarter-filters">
					<button class="btn btn-outline-primary active" data-q="all">All</button>
					<button class="btn btn-outline-primary" data-q="q1">Q1</button>
					<button class="btn btn-outline-primary" data-q="q2">Q2</button>
					<button class="btn btn-outline-primary" data-q="q3">Q3</button>
					<button class="btn btn-outline-primary" data-q="q4">Q4</button>
				</div>
				<div id="table-output"></div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/jantari.js"></script>
</body>

</html>
